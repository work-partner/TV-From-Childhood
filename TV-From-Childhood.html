<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV From Childhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall-bg:#2E4034;
    --wall-bg-deep:#233229;
    --wall-stripe:#C97D4B;
    --wood-dark:#3A2314;
    --wood:#6B4226;
    --wood-light:#8B5A2B;
    --wood-highlight:#A6693A;
    --bezel:#141210;
    --bezel-light:#242019;
    --cream:#F3E4C8;
    --cream-dim:#D9C7A3;
    --amber:#FFB238;
    --amber-dim:#C98A28;
    --red-led:#E4472A;
    --green-led:#5FBF6E;
    --metal:#CFCBBD;
    --metal-dark:#8B8778;
    --ink:#1C1610;
    --shadow-deep: rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    font-family:'Space Grotesk', sans-serif;
    color:var(--cream);
    background:
      repeating-linear-gradient(45deg, transparent 0 38px, rgba(0,0,0,.07) 38px 40px),
      radial-gradient(120% 80% at 50% -10%, #3d5647 0%, transparent 60%),
      linear-gradient(180deg, var(--wall-bg) 0%, var(--wall-bg) 65%, var(--wall-bg-deep) 100%);
    position:relative;
    overflow-x:hidden;
  }

  /* faux wainscoting strip along the bottom of the room */
  body::after{
    content:"";
    position:fixed;
    left:0; right:0; bottom:0;
    height:110px;
    background:
      repeating-linear-gradient(90deg, var(--wood-light) 0 3px, var(--wood) 3px 74px, var(--wood-dark) 74px 78px);
    box-shadow: 0 -6px 18px rgba(0,0,0,.4) inset, 0 -2px 0 var(--wall-stripe);
    z-index:0;
    pointer-events:none;
  }

  .room{
    position:relative;
    z-index:1;
    max-width:1000px;
    margin:0 auto;
    padding:56px 20px 150px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- HERO ---------- */
  .hero{ text-align:center; margin-bottom:44px; }

  .testbars{
    display:flex;
    width:220px;
    height:12px;
    margin:0 auto 18px;
    border:2px solid var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .testbars span{ flex:1; }
  .testbars span:nth-child(1){background:#F3E4C8;}
  .testbars span:nth-child(2){background:#E4C528;}
  .testbars span:nth-child(3){background:#3FC7C0;}
  .testbars span:nth-child(4){background:#4FAE52;}
  .testbars span:nth-child(5){background:#C154A0;}
  .testbars span:nth-child(6){background:#D5432C;}
  .testbars span:nth-child(7){background:#2E5FC9;}

  .wordmark{
    font-family:'Bungee', sans-serif;
    font-size:clamp(2rem, 6vw, 3.6rem);
    letter-spacing:.02em;
    margin:0 0 10px;
    color:var(--cream);
    text-shadow: 3px 3px 0 var(--wood-dark), 0 0 22px rgba(255,178,56,.25);
  }
  .tagline{
    margin:0;
    color:var(--cream-dim);
    font-size:1rem;
    letter-spacing:.02em;
  }

  /* ---------- TV UNIT ---------- */
  .tv-unit{ position:relative; width:100%; max-width:820px; margin-bottom:16px; }

  .antenna{ position:relative; height:70px; width:100%; }
  .antenna .rod{
    position:absolute; bottom:0; left:50%;
    width:4px; height:64px;
    background:linear-gradient(180deg, var(--metal), var(--metal-dark));
    border-radius:2px;
    transform-origin:bottom center;
  }
  .antenna .rod-left{ transform:translateX(-6px) rotate(-26deg); }
  .antenna .rod-right{ transform:translateX(2px) rotate(26deg); }
  .antenna .ball{
    position:absolute; bottom:60px; left:50%;
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--metal) 45%, var(--metal-dark) 100%);
  }
  .antenna .ball-left{ transform:translateX(-30px); }
  .antenna .ball-right{ transform:translateX(20px); }

  .cabinet{
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,.03) 0 2px, transparent 2px 7px),
      linear-gradient(160deg, var(--wood-light) 0%, var(--wood) 45%, var(--wood-dark) 100%);
    border-radius:26px;
    padding:20px 20px 26px;
    box-shadow:
      0 24px 40px var(--shadow-deep),
      inset 0 2px 0 rgba(255,255,255,.08),
      inset 0 -10px 24px rgba(0,0,0,.35);
    position:relative;
  }

  .cabinet-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .brand-plate{
    font-family:'Bungee', sans-serif;
    font-size:.72rem;
    letter-spacing:.14em;
    color:var(--wood-dark);
    background:linear-gradient(180deg, var(--metal), #a19c8c);
    padding:5px 14px;
    border-radius:4px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 2px 3px rgba(0,0,0,.4);
  }
  .power-led{
    width:9px; height:9px; border-radius:50%;
    background:#5a1c14;
    box-shadow:inset 0 0 2px rgba(0,0,0,.6);
    transition:background .2s, box-shadow .2s;
  }
  .power-led.lit{
    background:var(--red-led);
    box-shadow:0 0 8px 2px rgba(228,71,42,.9), inset 0 0 2px rgba(0,0,0,.3);
  }

  .tv-body{
    display:flex;
    gap:18px;
    align-items:stretch;
  }

  .screen-bezel{
    flex:1 1 auto;
    background:linear-gradient(160deg, var(--bezel-light), var(--bezel));
    border-radius:18px;
    padding:16px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.04), inset 0 10px 30px rgba(0,0,0,.7);
  }

  .screen{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:var(--ink);
    border-radius:10px;
    overflow:hidden;
    box-shadow: 0 0 0 3px #000, inset 0 0 40px rgba(0,0,0,.8);
    transform-origin:center;
  }

  .player-frame{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
    z-index:2;
    pointer-events:none;
  }
  .player-frame iframe{
    width:100%; height:100%; border:0; display:block;
  }

  .static-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    image-rendering:pixelated;
    opacity:0;
    transition:opacity .12s ease;
    z-index:4;
    pointer-events:none;
  }
  .screen.tuning .static-canvas{ opacity:1; }
  .screen.no-signal .static-canvas{ opacity:.9; }

  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
    z-index:7;
    pointer-events:none;
  }

  .channel-flash{
    position:absolute; top:10%; left:0; right:0;
    text-align:center;
    font-family:'VT323', monospace;
    font-size:22vw;
    max-font-size:110px;
    line-height:1;
    color:var(--amber);
    text-shadow:0 0 18px rgba(255,178,56,.85), 0 0 3px #000;
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .18s ease, transform .18s ease;
    z-index:8;
    pointer-events:none;
  }
  @media(min-width:600px){ .channel-flash{ font-size:5.5rem; } }
  .channel-flash.show{ opacity:1; transform:translateY(0); }

  /* Covers the iframe completely whenever it's not actively playing —
     YouTube shows its own title/branding overlay during start-up,
     buffering, and pause states no matter what the controls param says,
     so we hide the iframe behind our own themed card at those moments. */
  .hold-overlay{
    position:absolute; inset:0;
    background:rgba(20,16,12,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    opacity:0;
    transition:opacity .2s ease;
    z-index:8;
    pointer-events:none;
  }
  .hold-overlay.show{ opacity:1; }
  .hold-icon{
    font-family:'VT323', monospace;
    font-size:3rem;
    color:var(--amber);
    text-shadow:0 0 14px rgba(255,178,56,.7);
    line-height:1;
  }
  .hold-text{
    font-family:'VT323', monospace;
    font-size:1.1rem;
    letter-spacing:.16em;
    color:var(--cream-dim);
  }

  .no-signal-label{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:6px;
    font-family:'VT323', monospace;
    font-size:2.4rem;
    color:#e9e9e9;
    text-shadow:0 0 6px rgba(0,0,0,.8);
    z-index:5;
    letter-spacing:.06em;
    pointer-events:none;
  }
  .no-signal-label small{ font-size:1rem; letter-spacing:.1em; color:#bdbdbd; }
  .screen.no-signal .no-signal-label{ display:flex; }

  .off-screen{
    position:absolute; inset:0;
    background:#000;
    opacity:0;
    z-index:9;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  body.tv-off .off-screen{ opacity:1; pointer-events:auto; }

  body.tv-off .screen{
    animation:crtOff .5s ease forwards;
  }
  body:not(.tv-off) .screen.power-on-anim{
    animation:crtOn .5s ease forwards;
  }
  @keyframes crtOff{
    0%{ transform:scale(1); }
    55%{ transform:scaleY(.03) scaleX(1); }
    100%{ transform:scale(.02); }
  }
  @keyframes crtOn{
    0%{ transform:scale(.02); }
    45%{ transform:scaleY(.03) scaleX(1); }
    100%{ transform:scale(1); }
  }

  /* ---------- CONTROL PANEL ---------- */
  .control-panel{
    flex:0 0 108px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 4px;
  }

  .led-display{
    background:#0c0c0a;
    border-radius:6px;
    padding:6px 8px;
    width:100%;
    text-align:center;
    box-shadow:inset 0 0 8px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05);
  }
  .led-label{
    display:block;
    font-size:.55rem;
    letter-spacing:.2em;
    color:var(--amber-dim);
    font-family:'Space Grotesk', sans-serif;
  }
  .led-number{
    display:block;
    font-family:'VT323', monospace;
    font-size:2rem;
    color:var(--amber);
    text-shadow:0 0 8px rgba(255,178,56,.8);
    line-height:1;
  }

  .btn-group{ display:flex; flex-direction:column; gap:6px; width:100%; }
  .chan-btn, .mute-btn, .power-btn{
    font-family:'Space Grotesk', sans-serif;
    border:none;
    cursor:pointer;
    color:var(--cream);
    background:linear-gradient(180deg, #55402b, #3a2c1c);
    border-radius:8px;
    box-shadow:0 3px 0 var(--wood-dark), inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .chan-btn{ width:100%; padding:8px 0; font-size:.9rem; }
  .chan-btn:active, .mute-btn:active, .power-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--wood-dark), inset 0 1px 0 rgba(255,255,255,.12);
  }

  .playback-group{ display:flex; gap:6px; width:100%; }
  .play-btn{
    flex:1;
    padding:8px 0;
    font-size:.8rem;
    font-family:'Space Grotesk', sans-serif;
    border:none;
    cursor:pointer;
    color:var(--cream);
    background:linear-gradient(180deg, #55402b, #3a2c1c);
    border-radius:8px;
    box-shadow:0 3px 0 var(--wood-dark), inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .play-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--wood-dark), inset 0 1px 0 rgba(255,255,255,.12);
  }

  .mute-btn{
    width:44px; height:44px; border-radius:50%;
    font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
  }

  .power-btn{
    width:52px; height:52px; border-radius:50%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem;
    background:radial-gradient(circle at 35% 30%, #4a3a2a, #241a10);
  }
  .power-ring{
    position:absolute; inset:-4px;
    border-radius:50%;
    border:2px solid var(--red-led);
    opacity:.85;
    box-shadow:0 0 10px rgba(228,71,42,.7);
  }
  body.tv-off .power-ring{ border-color:#4a4a4a; box-shadow:none; opacity:.4; }

  button:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }

  .speaker-grille{
    margin-top:16px;
    display:grid;
    grid-template-columns:repeat(18, 1fr);
    gap:4px;
    padding:0 4px;
  }
  .speaker-grille span{
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #241a10, #0c0805);
    box-shadow:inset 0 0 2px rgba(0,0,0,.8);
  }

  .tv-legs{
    display:flex; justify-content:space-between;
    width:80%;
    margin:0 auto;
  }
  .tv-legs span{
    width:14px; height:26px;
    background:linear-gradient(180deg, var(--wood), var(--wood-dark));
    border-radius:0 0 6px 6px;
  }

  /* ---------- GUIDE ---------- */
  .guide{
    width:100%;
    max-width:720px;
    margin-top:56px;
  }
  .guide-title{
    font-family:'Bungee', sans-serif;
    font-size:1rem;
    letter-spacing:.14em;
    color:var(--amber);
    text-align:center;
    margin:0 0 18px;
  }
  .guide-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .guide-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.12));
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:10px 14px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .guide-row:hover, .guide-row:focus-visible{ border-color:var(--amber-dim); }
  .guide-row.active{ border-color:var(--amber); background:linear-gradient(180deg, rgba(255,178,56,.12), rgba(0,0,0,.12)); }

  .guide-num{
    font-family:'VT323', monospace;
    font-size:1.6rem;
    color:var(--amber);
    width:34px;
    text-align:center;
    flex:0 0 auto;
  }
  .guide-thumb{
    width:64px; height:44px;
    border-radius:6px;
    overflow:hidden;
    flex:0 0 auto;
    background:#000;
  }
  .guide-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .static-thumb{
    background:repeating-linear-gradient(115deg, #444 0 3px, #999 3px 5px, #222 5px 8px);
    opacity:.6;
  }

  .guide-info{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .guide-title-text{
    font-weight:600;
    font-size:.95rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .guide-sub{ font-size:.75rem; color:var(--cream-dim); }

  .on-air-badge{
    flex:0 0 auto;
    font-size:.65rem;
    letter-spacing:.1em;
    padding:4px 8px;
    border-radius:20px;
    background:var(--green-led);
    color:#0c1f0f;
    font-weight:700;
  }
  .on-air-badge.dim{ background:rgba(255,255,255,.12); color:var(--cream-dim); }

  .foot-note{
    margin-top:40px;
    text-align:center;
    color:var(--cream-dim);
    font-size:.85rem;
    max-width:520px;
  }

  @media (max-width:640px){
    .tv-body{ flex-direction:column; }
    .control-panel{
      flex-direction:row;
      flex:0 0 auto;
      width:100%;
      justify-content:space-between;
    }
    .btn-group{ flex-direction:row; flex:1; }
    .playback-group{ flex:1; }
    .led-display{ width:auto; flex:0 0 90px; }
  }

  @media (prefers-reduced-motion: reduce){
    .channel-flash, .off-screen, body.tv-off .screen, .screen.power-on-anim{
      animation:none !important;
      transition:none !important;
    }
  }
</style>
</head>
<body>

<div class="room">

  <div class="hero">
    <div class="testbars" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <h1 class="wordmark">TV From Childhood</h1>
    <p class="tagline">Turn the dial. Find your show. Just like Saturday mornings.</p>
  </div>

  <div class="tv-unit">
    <div class="antenna" aria-hidden="true">
      <span class="rod rod-left"></span>
      <span class="rod rod-right"></span>
      <span class="ball ball-left"></span>
      <span class="ball ball-right"></span>
    </div>

    <div class="cabinet">
      <div class="cabinet-top">
        <span class="brand-plate">TELETOON&nbsp;500</span>
        <span class="power-led lit" id="powerLed" aria-hidden="true"></span>
      </div>

      <div class="tv-body">
        <div class="screen-bezel">
          <div class="screen" id="screen">
            <canvas class="static-canvas" id="staticCanvas"></canvas>
            <div id="player" class="player-frame"></div>
            <div class="vignette" aria-hidden="true"></div>
            <div class="channel-flash" id="channelFlash">01</div>
            <div class="hold-overlay" id="holdOverlay">
              <span class="hold-icon" id="holdIcon">📡</span>
              <span class="hold-text" id="holdText">TUNING IN…</span>
            </div>
            <div class="no-signal-label" id="noSignalLabel">
              <span>NO SIGNAL</span>
              <small>please stand by</small>
            </div>
            <div class="off-screen" aria-hidden="true"></div>
          </div>
        </div>

        <div class="control-panel">
          <div class="led-display">
            <span class="led-label">CHANNEL</span>
            <span class="led-number" id="ledNumber">01</span>
          </div>

          <div class="btn-group">
            <button class="chan-btn" id="chanUp" aria-label="Channel up">▲ CH</button>
            <button class="chan-btn" id="chanDown" aria-label="Channel down">▼ CH</button>
          </div>

          <div class="playback-group">
            <button class="play-btn" id="skipBack" aria-label="Skip back 10 seconds" title="-10s">⏪</button>
            <button class="play-btn" id="playPauseBtn" aria-label="Play or pause" title="Play / pause">⏸</button>
            <button class="play-btn" id="skipFwd" aria-label="Skip forward 10 seconds" title="+10s">⏩</button>
          </div>

          <div style="display:flex; gap:8px;">
            <button class="mute-btn" id="muteBtn" aria-label="Toggle mute" title="Mute / unmute">🔊</button>
            <button class="power-btn" id="powerBtn" aria-label="Toggle power" title="Power">
              <span class="power-ring" aria-hidden="true"></span>
              <span class="power-icon" aria-hidden="true">⏻</span>
            </button>
          </div>
        </div>
      </div>

      <div class="speaker-grille" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="tv-legs" aria-hidden="true"><span></span><span></span></div>
  </div>

  <section class="guide" aria-label="Channel guide">
    <h2 class="guide-title">CHANNEL GUIDE</h2>
    <ul class="guide-list" id="guideList"></ul>
  </section>

  <div class="foot-note">
    <p>More channels get added as reruns come in — every empty slot is just waiting for its next cartoon.</p>
  </div>

</div>

<script>
  /* ============================================================
     CHANNEL LINE-UP
     Each channel is a real rotating schedule, not a single video.
     List episodes in order with their duration in seconds — the
     schedule (start/end time of each one) is calculated from that,
     so the numbers just need to be accurate, not hand-timed.

     To add more channels or episodes: add a { videoId, duration }
     entry to a channel's "videos" array, or a whole new channel
     object with its own "videos" array. Leave "videos" as an empty
     array for an empty "no signal" slot.
     ============================================================ */
  const CHANNELS = [
    {
      id: 1,
      name: 'Oggy and the Cockroaches — Hindi',
      videos: [
        { videoId: 'dZtT8n4HXh4', duration: 3187 },  // 53:07
        { videoId: 'ec4x_qAeNI8', duration: 3955 },  // 1:05:55
        { videoId: 'eVoke05WS8Y', duration: 3927 },  // 1:05:27
        { videoId: 'lvVe7A4OVKM', duration: 3957 },  // 1:05:57
        { videoId: 'g6YrNUU7b_A', duration: 3187 },  // 53:07
        { videoId: 'I0-LoQq1cNk', duration: 3945 },  // 1:05:45
        { videoId: 'GrXAQSiUxxI', duration: 4473 },  // 1:14:33
        { videoId: 'ldouKXyJQZM', duration: 3683 },  // 1:01:23
      ]
    },
    {
      id: 2,
      name: 'Bas Karo Henry — Hindi',
      videos: [
        { videoId: 'OOMeuE8tTy0', duration: 10922 }, // 3:02:02
        { videoId: 'Kc-heJS1mM8', duration: 3600 },   // 1:00:00
        { videoId: '8P8EPxAKSiI', duration: 3978 },   // 1:06:18
        { videoId: 'aq1LOjyW03Q', duration: 4021 },   // 1:07:01
        { videoId: 'pVhqTD1SUZY', duration: 3540 },   // 0:59:00
        { videoId: 'Hv-ibS9TKqI', duration: 2625 },   // 0:43:45
      ]
    },
    { id: 3, name: null, videos: [] },
    { id: 4, name: null, videos: [] },
  ];

  /* A fixed instant in time that the very first episode of each
     channel is anchored to: 2024-01-01 00:00:00 IST. The schedule
     then loops continuously forward from there forever — it never
     resets at midnight, so because a channel's total runtime isn't
     an exact multiple of 24 hours, the episode airing at any given
     clock time slowly drifts day to day, same as a real rerun
     channel. Every viewer computes this from the same real-world
     clock, so everyone lands on the same episode at the same
     instant, wherever they are. */
  const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
  const SCHEDULE_EPOCH_MS = Date.UTC(2024, 0, 1, 0, 0, 0) - IST_OFFSET_MS;

  // Pre-compute each channel's cumulative timeline once at startup.
  CHANNELS.forEach(ch => {
    let t = 0;
    ch.schedule = (ch.videos || []).map((v, i) => {
      const start = t;
      t += v.duration;
      return { videoId: v.videoId, duration: v.duration, start, end: t, index: i };
    });
    ch.total = t;
  });

  /* Given a channel, work out exactly what should be airing right
     now and how far into it we are. Pure function of Date.now(), so
     it always reflects the live, synced position. */
  function getLiveState(ch){
    if(!ch.total) return null;
    const elapsed = (Date.now() - SCHEDULE_EPOCH_MS) / 1000;
    const pos = ((elapsed % ch.total) + ch.total) % ch.total;
    const item = ch.schedule.find(v => pos >= v.start && pos < v.end) || ch.schedule[ch.schedule.length - 1];
    return {
      videoId: item.videoId,
      offset: pos - item.start,
      remaining: item.end - pos,
      index: item.index
    };
  }

  const screenEl = document.getElementById('screen');
  const channelFlash = document.getElementById('channelFlash');
  const ledNumber = document.getElementById('ledNumber');
  const guideList = document.getElementById('guideList');
  const powerLed = document.getElementById('powerLed');
  const powerBtn = document.getElementById('powerBtn');
  const muteBtn = document.getElementById('muteBtn');
  const chanUp = document.getElementById('chanUp');
  const chanDown = document.getElementById('chanDown');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const skipBackBtn = document.getElementById('skipBack');
  const skipFwdBtn = document.getElementById('skipFwd');
  const holdOverlay = document.getElementById('holdOverlay');
  const holdIcon = document.getElementById('holdIcon');
  const holdText = document.getElementById('holdText');
  const staticCanvas = document.getElementById('staticCanvas');
  const ctx = staticCanvas.getContext('2d');

  const SW = 80, SH = 60;
  staticCanvas.width = SW;
  staticCanvas.height = SH;

  let currentIndex = 0;
  let isOn = true;
  let isMuted = false;
  let tuneTimer = null;
  let staticRAF = null;

  /* the real player, created via the official YouTube IFrame API
     so we can hide all native YouTube chrome and drive playback
     with our own buttons */
  let ytPlayer = null;
  let playerReady = false;
  let pendingVideoId = null;
  let pendingOffset = 0;
  let currentLiveVideoId = null;
  let advanceTimer = null;
  let resyncInterval = null;

  function pad(n){ return n.toString().padStart(2,'0'); }

  function setHoldOverlay(visible, icon, text){
    if(icon !== undefined) holdIcon.textContent = icon;
    if(text !== undefined) holdText.textContent = text;
    holdOverlay.classList.toggle('show', visible);
  }

  /* ---------------- static noise ---------------- */
  function drawStaticFrame(){
    const imgData = ctx.createImageData(SW, SH);
    for(let i=0; i<imgData.data.length; i+=4){
      const v = (Math.random()*255)|0;
      imgData.data[i]=v; imgData.data[i+1]=v; imgData.data[i+2]=v; imgData.data[i+3]=255;
    }
    ctx.putImageData(imgData,0,0);
  }
  function startStatic(){
    if(staticRAF) return;
    (function loop(){
      drawStaticFrame();
      staticRAF = requestAnimationFrame(loop);
    })();
  }
  function stopStatic(){
    if(staticRAF){ cancelAnimationFrame(staticRAF); staticRAF = null; }
  }

  /* ---------------- guide rendering ---------------- */
  function renderGuide(){
    guideList.innerHTML = CHANNELS.map((ch, i) => {
      const active = i === currentIndex;
      if(ch.videos && ch.videos.length){
        const liveVideoId = ch.liveVideoId || ch.schedule[0].videoId;
        return `
          <li class="guide-row ${active ? 'active' : ''}" data-index="${i}" tabindex="0">
            <span class="guide-num">${pad(ch.id)}</span>
            <span class="guide-thumb">
              <img src="https://img.youtube.com/vi/${liveVideoId}/mqdefault.jpg" alt="" loading="lazy" onerror="this.parentElement.classList.add('static-thumb'); this.remove();">
            </span>
            <span class="guide-info">
              <span class="guide-title-text">${ch.name}</span>
              <span class="guide-sub">${ch.liveTitle ? 'Now: ' + ch.liveTitle : 'Tap to tune in'}</span>
            </span>
            <span class="on-air-badge ${active && isOn ? '' : 'dim'}">${active && isOn ? 'ON AIR' : 'TUNE IN'}</span>
          </li>`;
      }
      return `
        <li class="guide-row no-signal-row ${active ? 'active' : ''}" data-index="${i}" tabindex="0">
          <span class="guide-num">${pad(ch.id)}</span>
          <span class="guide-thumb static-thumb" aria-hidden="true"></span>
          <span class="guide-info">
            <span class="guide-title-text">No Signal</span>
            <span class="guide-sub">Reserved for a future rerun</span>
          </span>
          <span class="on-air-badge dim">EMPTY</span>
        </li>`;
    }).join('');

    guideList.querySelectorAll('.guide-row').forEach(row => {
      row.addEventListener('click', () => tuneTo(parseInt(row.dataset.index, 10)));
      row.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          tuneTo(parseInt(row.dataset.index, 10));
        }
      });
    });
  }

  /* Keeps every channel's guide entry (thumbnail + title) showing
     whatever is actually airing right now, even for channels you
     aren't currently watching — like a real programme guide. */
  async function fetchOembedTitle(videoId){
    try{
      const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + videoId)}&format=json`);
      if(!res.ok) return null;
      const data = await res.json();
      return data.title || null;
    }catch(e){ return null; }
  }

  function refreshGuideLiveInfo(){
    CHANNELS.forEach(ch => {
      if(!ch.videos || !ch.videos.length) return;
      const state = getLiveState(ch);
      if(!state) return;
      if(state.videoId !== ch.liveVideoId){
        ch.liveVideoId = state.videoId;
        fetchOembedTitle(state.videoId).then(title => {
          ch.liveTitle = title || null;
          renderGuide();
        });
      }
    });
    renderGuide();
  }

  /* ---------------- tuning ---------------- */
  function flashNumber(id){
    channelFlash.textContent = pad(id);
    channelFlash.classList.add('show');
    clearTimeout(flashNumber._t);
    flashNumber._t = setTimeout(() => channelFlash.classList.remove('show'), 900);
  }

  function tuneTo(index){
    if(!isOn) return;
    currentIndex = index;
    const ch = CHANNELS[index];

    clearAdvanceTimer();
    clearResyncInterval();

    screenEl.classList.add('tuning');
    startStatic();
    flashNumber(ch.id);
    ledNumber.textContent = pad(ch.id);
    renderGuide();

    clearTimeout(tuneTimer);
    tuneTimer = setTimeout(() => {
      if(ch.videos && ch.videos.length){
        screenEl.classList.remove('no-signal');
        setHoldOverlay(true, '📡', 'TUNING IN…');
        playLive(ch);
        stopStatic();
      } else {
        if(ytPlayer && playerReady && ytPlayer.stopVideo){ ytPlayer.stopVideo(); }
        pendingVideoId = null;
        setHoldOverlay(false);
        screenEl.classList.add('no-signal');
        startStatic();
      }
      screenEl.classList.remove('tuning');
    }, 650);
  }

  /* Tunes in to whatever is actually airing on this channel right
     now, then arms a timer for the exact moment that episode is
     scheduled to end so it hands off to the next one automatically —
     re-deriving live state fresh each time, so even a throttled or
     delayed timer always lands on the correct episode. */
  function playLive(ch){
    const state = getLiveState(ch);
    if(!state) return;
    currentLiveVideoId = state.videoId;
    loadVideoAt(state.videoId, state.offset);
    scheduleAdvance(ch, state.remaining);
    startResyncWatch(ch);
  }

  function loadVideoAt(videoId, offset){
    if(playerReady && ytPlayer && ytPlayer.loadVideoById){
      ytPlayer.loadVideoById({ videoId, startSeconds: offset });
      isMuted ? ytPlayer.mute() : ytPlayer.unMute();
    } else {
      pendingVideoId = videoId;
      pendingOffset = offset;
    }
  }

  function clearAdvanceTimer(){
    if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
  }
  function scheduleAdvance(ch, remainingSeconds){
    clearAdvanceTimer();
    const ms = Math.max(500, remainingSeconds * 1000 + 250);
    advanceTimer = setTimeout(() => {
      if(!isOn) return;
      playLive(ch); // re-derive fresh — naturally lands on the next episode
    }, ms);
  }

  function clearResyncInterval(){
    if(resyncInterval){ clearInterval(resyncInterval); resyncInterval = null; }
  }
  /* Periodically checks the real player against where the schedule
     says it should be, and gently corrects for drift (buffering,
     background-tab throttling, etc.) so playback stays locked to
     the shared broadcast clock. */
  function startResyncWatch(ch){
    clearResyncInterval();
    resyncInterval = setInterval(() => {
      if(!isOn || !playerReady || !ytPlayer) return;
      const state = getLiveState(ch);
      if(!state) return;
      if(state.videoId !== currentLiveVideoId){
        playLive(ch);
        return;
      }
      if(typeof ytPlayer.getCurrentTime === 'function'){
        const actual = ytPlayer.getCurrentTime();
        if(Math.abs(actual - state.offset) > 4){
          ytPlayer.seekTo(state.offset, true);
        }
      }
    }, 15000);
  }

  // Snap back to the live position as soon as the tab becomes visible
  // again, in case timers were paused while it was in the background.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && isOn){
      const ch = CHANNELS[currentIndex];
      if(ch.videos && ch.videos.length){ playLive(ch); }
    }
  });

  /* ---------------- controls ---------------- */
  chanUp.addEventListener('click', () => {
    tuneTo((currentIndex + 1) % CHANNELS.length);
  });
  chanDown.addEventListener('click', () => {
    tuneTo((currentIndex - 1 + CHANNELS.length) % CHANNELS.length);
  });

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    if(ytPlayer && playerReady){
      isMuted ? ytPlayer.mute() : ytPlayer.unMute();
    }
  });

  playPauseBtn.addEventListener('click', () => {
    if(!ytPlayer || !playerReady || !window.YT) return;
    const state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      const ch = CHANNELS[currentIndex];
      if(ch.videos && ch.videos.length){
        playLive(ch); // catch back up to live, rather than resuming the paused spot
      } else {
        ytPlayer.playVideo();
      }
    }
  });

  skipBackBtn.addEventListener('click', () => {
    if(!ytPlayer || !playerReady) return;
    const t = Math.max(0, ytPlayer.getCurrentTime() - 10);
    ytPlayer.seekTo(t, true);
  });

  skipFwdBtn.addEventListener('click', () => {
    if(!ytPlayer || !playerReady) return;
    const dur = ytPlayer.getDuration() || Infinity;
    const t = Math.min(dur, ytPlayer.getCurrentTime() + 10);
    ytPlayer.seekTo(t, true);
  });

  function updatePlayPauseIcon(){
    if(!ytPlayer || !playerReady || !window.YT) return;
    const state = ytPlayer.getPlayerState();
    playPauseBtn.textContent = state === YT.PlayerState.PLAYING ? '⏸' : '▶';
  }

  /* Runs on every YouTube player state change. YouTube shows its own
     branded overlay (title bar + big icon) any time the video isn't
     actively PLAYING, so we mirror that with our own card and let the
     real iframe only peek through while a show is actually running. */
  function handlePlayerState(){
    updatePlayPauseIcon();
    if(!window.YT || !ytPlayer) return;
    switch(ytPlayer.getPlayerState()){
      case YT.PlayerState.PLAYING:
        setHoldOverlay(false);
        break;
      case YT.PlayerState.PAUSED:
        setHoldOverlay(true, '❚❚', 'PAUSED');
        break;
      case YT.PlayerState.ENDED:
        setHoldOverlay(true, '■', 'END OF BROADCAST');
        break;
      default:
        setHoldOverlay(true, '📡', 'TUNING IN…');
    }
  }

  function setPower(on){
    isOn = on;
    powerLed.classList.toggle('lit', on);
    document.body.classList.toggle('tv-off', !on);

    if(on){
      screenEl.classList.remove('power-on-anim');
      void screenEl.offsetWidth; // restart animation
      screenEl.classList.add('power-on-anim');
      tuneTo(currentIndex);
    } else {
      if(ytPlayer && playerReady && ytPlayer.stopVideo){ ytPlayer.stopVideo(); }
      pendingVideoId = null;
      clearAdvanceTimer();
      clearResyncInterval();
      setHoldOverlay(false);
      stopStatic();
      screenEl.classList.remove('tuning', 'no-signal');
    }
    renderGuide();
  }
  powerBtn.addEventListener('click', () => setPower(!isOn));

  /* ---------------- YouTube IFrame Player API ---------------- */
  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('player', {
      height:'100%',
      width:'100%',
      playerVars:{
        controls:0,          // hide native play bar, title, and end-card
        rel:0,                // no related videos from other channels
        modestbranding:1,
        iv_load_policy:3,     // hide annotations
        disablekb:1,
        fs:0,
        playsinline:1,
        origin: location.origin
      },
      events:{
        onReady: function(){
          playerReady = true;
          if(pendingVideoId){
            ytPlayer.loadVideoById({ videoId: pendingVideoId, startSeconds: pendingOffset || 0 });
            pendingVideoId = null;
            pendingOffset = 0;
            if(isMuted){ ytPlayer.mute(); }
          }
          handlePlayerState();
        },
        onStateChange: handlePlayerState
      }
    });
  };

  /* ---------------- init ---------------- */
  renderGuide();
  ledNumber.textContent = pad(CHANNELS[currentIndex].id);
  tuneTo(currentIndex);
  refreshGuideLiveInfo();
  setInterval(refreshGuideLiveInfo, 30000);
</script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
